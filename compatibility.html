<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Compatibility Test — Match or Move On</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
  :root{ --bg:#0b0b0d; --text:#e9e2db; --muted:#c9c2bb; --rose:#ff3b30; --glass:rgba(255,255,255,.04); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--text);overflow-x:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg)}
  html{scroll-behavior:smooth}

  /* ===== NAV ===== */
  #sparks{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg-float{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .nav{position:fixed;top:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:14px 24px;backdrop-filter:blur(8px);
    background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0)),
               radial-gradient(70% 50% at 50% 0%,rgba(255,59,48,.10),transparent 60%);
    border-bottom:1px solid rgba(255,255,255,.06)}
  .nav-left{justify-self:start}
  .nav-left a,.nav-right a{color:#ffecec;text-decoration:none;font-weight:600;padding:8px 10px;border-radius:12px;border:1px solid transparent}
  .nav-left a:hover,.nav-right a:hover{border-color:rgba(255,59,48,.45);background:rgba(255,59,48,.10)}
  .logo-neon{justify-self:center;font-family:"Playfair Display",serif;font-weight:700;letter-spacing:.35px;
    font-size:clamp(18px,2.4vw,30px);color:#fff;text-transform:uppercase;white-space:nowrap;
    text-shadow:0 0 20px rgba(255,59,48,.65),0 0 8px rgba(255,59,48,.45)}
  .logo-neon .accent{color:var(--rose)}
  .nav-right{justify-self:end;display:flex;gap:18px;align-items:center}
  .lang{position:relative;z-index:10}
  .lang-current{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.45);color:#fff;
    border:1px solid rgba(255,59,48,.45);padding:6px 10px;border-radius:16px;font-weight:700;cursor:pointer;
    text-shadow:0 0 8px rgba(255,59,48,.55); user-select:none}
  .lang-menu{position:absolute;right:0;top:115%;display:none;flex-direction:column;gap:6px;
    background:rgba(0,0,0,.8);border:1px solid rgba(255,59,48,.45);border-radius:12px;padding:8px;max-height:50vh;overflow:auto;
    box-shadow:0 0 12px rgba(255,59,48,.35), inset 0 0 8px rgba(255,59,48,.25)}
  .lang.open .lang-menu{display:flex}
  @media (hover:hover){ .lang:hover .lang-menu{display:flex} }
  .lang-menu a{color:#fff;text-decoration:none;font-weight:600;padding:6px 10px;border-radius:10px}
  .lang-menu a:hover{background:rgba(255,59,48,.12)}

  /* ===== PAGE WRAP ===== */
  .wrap{position:relative;z-index:2;min-height:100vh;display:flex;justify-content:center;padding:120px 16px 96px}
  .page{max-width:min(760px,94vw);width:100%}
  .page h1{font-family:"Playfair Display",serif;font-size:clamp(32px,5.2vw,56px);line-height:1.08;margin:0 0 6px}
  .lead{color:var(--muted);margin:4px 0 18px}

  /* ===== PROGRESS ===== */
  .progress{width:100%;height:10px;background:#1b1b1d;border-radius:999px;overflow:hidden;margin:0 0 8px;border:1px solid rgba(255,255,255,.08)}
  .progress-bar{height:100%;width:0;background:var(--rose);transition:width .35s ease}
  .pct{color:#cbbfb7;margin-bottom:12px}

  /* ===== QUESTION CARD ===== */
  .question-box{background:var(--glass);border:1px solid rgba(255,255,255,.10);border-radius:18px;
    padding:24px 16px;margin-bottom:14px;box-shadow:0 0 14px rgba(255,59,48,.12), inset 0 0 12px rgba(255,255,255,.04)}
  .q-index{display:block;color:#bfb7b0;font-size:.9rem;margin-bottom:6px}
  .q-title{font-family:"Playfair Display",serif;font-size:clamp(18px,3.8vw,24px);margin:0 0 12px;color:#fff}
  input[type="text"], input[type="email"], select{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.10);
    background:#111214;color:#fff;font-size:1rem;outline:none
  }
  .options{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:10px;background:#121215;border:1px solid rgba(255,255,255,.08);padding:10px 12px;border-radius:12px}
  .opt input{appearance:none;width:18px;height:18px;border:2px solid #666;border-radius:50%;display:inline-block;position:relative;cursor:pointer;background:transparent}
  .opt input:checked{border-color:var(--rose)}
  .opt input:checked::after{content:"";position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:50%;background:var(--rose);transform:translate(-50%,-50%)}
  .hint{font-size:.9rem;color:#bfb7b0;margin-top:6px}

  /* ===== NAV BUTTONS (ghost style) ===== */
  .nav-buttons{display:flex;gap:12px;margin-top:10px}
  .btn-ghost{
    flex:1;display:inline-flex;align-items:center;justify-content:center;
    padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer;
    background:transparent;border:2px solid var(--rose);color:var(--rose);transition:.25s;
  }
  .btn-ghost:hover{background:var(--rose);color:#fff;transform:translateY(-1px)}
  .btn-ghost:disabled{opacity:.35;cursor:not-allowed}

  /* ===== SUMMARY + SHARE ===== */
  .summary{background:var(--glass);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:18px}
  .summary h3{margin:0 0 8px;font-family:"Playfair Display",serif}
  .summary .row{display:flex;gap:10px;border-bottom:1px dashed rgba(255,255,255,.08);padding:8px 0}
  .summary .row:last-child{border-bottom:none}
  .summary .k{color:#bfb7b0;min-width:160px}
  .summary .v{flex:1}

  .share-card{background:var(--glass);border:1px solid rgba(255,255,255,.10);
    border-radius:16px;padding:16px;margin-top:14px}
  .share-card h4{margin:0 0 10px}
  .share-row{display:flex;gap:10px;align-items:center}
  .share-input{
    flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
    background:#111214;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .share-actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .cta-alone{margin-top:14px}
  @media (max-width:768px){
    .nav{display:flex;flex-wrap:wrap;gap:8px 12px;padding:10px 12px}
    .logo-neon{order:0;width:100%;text-align:center;font-size:clamp(16px,5.2vw,22px)}
    .nav-left{order:1}
    .nav-right{order:1;margin-left:auto;display:flex;gap:14px;align-items:center}
    .wrap{padding-top:112px}
  }
</style>
</head>
<body>

<!-- Sparks background -->
<canvas id="sparks"></canvas>
<!-- Floating hearts -->
<div class="bg-float" id="hearts"></div>

<!-- NAV -->
<nav class="nav">
  <div class="nav-left"><a href="index.html">Home</a></div>
  <div class="logo-neon">MATCH OR <span class="accent">MOVE ON</span></div>
  <div class="nav-right">
    <a href="how-it-works.html">How it works</a>
    <a href="contact.html">Contact</a>
    <div class="lang" id="lang">
      <div class="lang-current" id="langBtn">🇺🇸 EN ▾</div>
      <div class="lang-menu" id="langMenu">
        <!-- Ajoute ici tes liens de langues si besoin -->
        <a href="#">🇫🇷 FR</a><a href="#">🇵🇹 PT</a><a href="#">🇪🇸 ES</a>
      </div>
    </div>
  </div>
</nav>

<main class="wrap">
  <section class="page">
    <h1>Compatibility Test</h1>
    <p class="lead">Answer step by step to see if you’re truly a match — or if it’s better to move on.</p>

    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="pct" id="pctDone">0% complete</div>

    <!-- QUESTION STEP -->
    <div class="question-box" id="q-box">
      <small class="q-index" id="q-index">Question 1 / 1</small>
      <h2 class="q-title" id="q-title">Loading…</h2>
      <div id="q-inputs"></div>
      <div class="hint" id="q-hint"></div>
    </div>

    <!-- NAV BUTTONS -->
    <div class="nav-buttons" id="nav-buttons">
      <button class="btn-ghost" id="prev-btn" onclick="prevQ()">Back</button>
      <button class="btn-ghost" id="next-btn" onclick="nextQ()">Next</button>
    </div>

    <!-- SUMMARY + SHARE -->
    <div id="summary" style="display:none;margin-top:18px"></div>

    <!-- SHARE BLOCK (Initiator only) -->
    <div id="shareBlock" class="share-card" style="display:none">
      <h4>Share your link</h4>
      <div class="share-row">
        <input id="shareLink" class="share-input" readonly value="https://matchormoveon.com/compatibility/abc123"/>
      </div>
      <div class="share-actions">
        <button class="btn-ghost" id="copyBtn">Copy link</button>
        <a class="btn-ghost" id="waBtn" href="#" target="_blank" rel="noopener">Share via WhatsApp</a>
        <a class="btn-ghost" id="smsBtn" href="#">Share via SMS</a>
      </div>
    </div>

    <!-- PARTNER CTA (Partner only) -->
    <div id="partnerCTA" class="cta-alone" style="display:none">
      <button class="btn-ghost" id="letsGoBtn">See if we match — Let’s Go!!!</button>
    </div>
  </section>
</main>

<!-- === YOUR FOOTER HERE === -->
<!-- Colle ton footer complet ici (même style que Love Passport) -->

<!-- ===== SPARKS CANVAS ===== -->
<script>
const s=document.getElementById('sparks'),ctx=s.getContext('2d');let W,H,PS;
function size(){W=s.width=innerWidth;H=s.height=innerHeight;
  const n=Math.min(180,Math.floor(W*H/11000));
  PS=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,a:Math.random()*6.28,s:Math.random()*.45+.12,o:Math.random()*.35+.15}));
}
function loop(){ctx.clearRect(0,0,W,H);
  for(const p of PS){p.a+=.0028;p.x+=Math.cos(p.a)*p.s;p.y+=Math.sin(p.a)*p.s*.45;
    if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);g.addColorStop(0,`rgba(255,80,80,${p.o})`);g.addColorStop(1,'rgba(255,80,80,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3,0,6.28);ctx.fill();}
  requestAnimationFrame(loop);
}
addEventListener('resize',size);size();loop();
</script>

<!-- FLOATING HEARTS -->
<script>
(function(){
  const LAYER=document.getElementById('hearts'); if(!LAYER) return;
  const HEART=encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="72" viewBox="0 0 40 36">
    <defs><radialGradient id="hg" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#ffd0d4"/><stop offset="45%" stop-color="#ff5252"/><stop offset="100%" stop-color="#7c1414"/></radialGradient></defs>
    <g filter="drop-shadow(0 4px 10px rgba(255,80,80,.55))">
      <path d="M20 34 C5 22,0 16,0 10 C0 5,4 2,8 2 C12 2,15 4,20 9 C25 4,28 2,32 2 C36 2,40 5,40 10 C40 16,35 22,20 34Z" fill="url(#hg)"/>
      <ellipse cx="14" cy="10" rx="8" ry="4.5" fill="white" opacity=".22"/>
    </g></svg>`);
  const isM = matchMedia('(max-width:768px)').matches;
  const COUNT=isM?12:18, MIN_W=22, MAX_W=64, MIN_T=18, MAX_T=28;
  function spawn(svg){
    const el=document.createElement('img');
    el.src=`data:image/svg+xml;utf8,${svg}`; el.className='float-item';
    el.style.left=Math.random()*100+'vw';
    el.style.setProperty('--w',(MIN_W+Math.random()*(MAX_W-MIN_W))+'px');
    el.style.setProperty('--x',(Math.random()*80-40)+'px');
    el.style.setProperty('--t',(MIN_T+Math.random()*(MAX_T-MIN_T))+'s');
    el.style.setProperty('--r',(Math.random()*40-20)+'deg');
    el.style.setProperty('--rEnd',(200+Math.random()*260)+'deg');
    el.style.setProperty('--spin',(14+Math.random()*10)+'s');
    el.style.animationDelay=(Math.random()*12).toFixed(2)+'s';
    el.style.position='absolute';
    el.style.top='100vh';
    el.style.filter='drop-shadow(0 8px 18px rgba(255,59,48,.45))';
    el.style.opacity='.95';
    el.style.animation='floatUp var(--t) linear infinite, spin var(--spin) linear infinite';
    LAYER.appendChild(el);
  }
  for(let i=0;i<COUNT;i++) spawn(HEART);
})();
</script>
<style>
@keyframes floatUp{
  0%{transform:translateX(var(--x,0)) translateY(0) rotate(var(--r,0deg));opacity:0}
  10%{opacity:1}
  100%{transform:translateX(calc(var(--x,0) + 40px)) translateY(-120vh) rotate(var(--rEnd,360deg));opacity:0}
}
@keyframes spin{
  0%{filter:drop-shadow(0 8px 18px rgba(255,59,48,.45))}
  50%{filter:drop-shadow(0 12px 26px rgba(255,59,48,.60))}
  100%{filter:drop-shadow(0 8px 18px rgba(255,59,48,.45))}
}
</style>

<!-- ===== LANG DROPDOWN (petit JS) ===== -->
<script>
(function(){
  const lang=document.getElementById('lang'), btn=document.getElementById('langBtn'), menu=document.getElementById('langMenu');
  if(!lang||!btn||!menu) return;
  function close(){ lang.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
  btn.addEventListener('click', (e)=>{ e.stopPropagation(); lang.classList.toggle('open'); btn.setAttribute('aria-expanded',lang.classList.contains('open')); });
  document.addEventListener('click', close);
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') close(); });
})();
</script>

<!-- ===================== COMPATIBILITY SCRIPT ===================== -->
<script>
/* === LANG CONSTANTS PLACEHOLDER ===================================
   Colle ici tes grands tableaux (COUNTRIES, options traduites, etc.)
   Exemple:
   // const COUNTRIES = [ "France","Côte d’Ivoire", ... ];
==================================================================== */

/* ===== Questions minimales pour démarrer (remplace plus tard) ===== */
const QUESTIONS = [
  {id:"fullName", type:"text",  label:"Please enter your full name", required:true, placeholder:"First and last name"},
  {id:"email",    type:"text",  label:"Your email (to receive the result)", required:true, placeholder:"name@email.com", inputType:"email"},
  {id:"agree",    type:"single",label:"Do you agree to share your answers for a match result?", required:true, options:["Yes","No"]},
];
const STEPS = ["fullName","email","agree"];

/* ===== Références UI ===== */
const elBar=document.getElementById("progress-bar");
const elPct=document.getElementById("pctDone");
const elQBox=document.getElementById("q-box");
const elQIndex=document.getElementById("q-index");
const elQTitle=document.getElementById("q-title");
const elQInputs=document.getElementById("q-inputs");
const elHint=document.getElementById("q-hint");
const elSummary=document.getElementById("summary");
const btnPrev=document.getElementById("prev-btn");
const btnNext=document.getElementById("next-btn");
const shareBlock=document.getElementById("shareBlock");
const shareInput=document.getElementById("shareLink");
const copyBtn=document.getElementById("copyBtn");
const waBtn=document.getElementById("waBtn");
const smsBtn=document.getElementById("smsBtn");
const partnerCTA=document.getElementById("partnerCTA");
const letsGoBtn=document.getElementById("letsGoBtn");

/* ===== État + contexte ===== */
const state={}; let currentIndex=0;
const params=new URLSearchParams(location.search);
const isPartner=params.has("partner");

/* ===== Helpers ===== */
function findQuestion(id){ return QUESTIONS.find(q=>q.id===id); }
function visibleSteps(){ return STEPS.slice(); }
function isAnswered(q){
  const v=state[q.id];
  if(q.type==="text") return v && String(v).trim().length>0;
  if(q.type==="single"||q.type==="select") return !!v;
  if(q.type==="multi") return Array.isArray(v)&&v.length>=(q.min||1);
  return false;
}
function calcProgress(){
  const vis=visibleSteps();
  const a=vis.filter(id=>isAnswered(findQuestion(id))).length;
  return vis.length?Math.floor(a/vis.length*100):0;
}
function updateProgressUI(){
  const vis=visibleSteps();
  const pct=calcProgress();
  elBar.style.width=pct+"%";
  elPct.textContent=`${pct}% complete`;
  elQIndex.textContent=`Question ${Math.min(currentIndex+1,vis.length)} / ${vis.length||1}`;
}
function setHint(t){ elHint.textContent=t||""; }

/* ===== Rendu ===== */
function render(){
  const vis=visibleSteps(); if(!vis.length){ elQTitle.textContent="No questions."; return; }
  if(currentIndex<0) currentIndex=0;
  if(currentIndex>=vis.length) currentIndex=vis.length-1;
  const q=findQuestion(vis[currentIndex]);

  elQInputs.innerHTML=""; setHint(""); elQTitle.textContent=q.label;

  if(q.type==="text"){
    const inp=document.createElement("input");
    inp.type=q.inputType||"text"; inp.placeholder=q.placeholder||"";
    if(state[q.id]) inp.value=state[q.id];
    inp.addEventListener("input",e=>{state[q.id]=e.target.value; updateProgressUI();});
    elQInputs.appendChild(inp);
  }else if(q.type==="single"){
    const wrap=document.createElement("div"); wrap.className="options";
    q.options.forEach(o=>{
      const row=document.createElement("div"); row.className="opt";
      const input=document.createElement("input"); input.type="radio"; input.name=q.id; input.value=o;
      if(state[q.id]===o) input.checked=true;
      input.addEventListener("change",()=>{state[q.id]=o; updateProgressUI();});
      const lab=document.createElement("label"); lab.textContent=o;
      lab.addEventListener("click",()=>{input.checked=true; input.dispatchEvent(new Event('change'));});
      row.appendChild(input); row.appendChild(lab); wrap.appendChild(row);
    });
    elQInputs.appendChild(wrap);
  }
  btnPrev.disabled=(currentIndex===0);
  btnNext.textContent=(currentIndex===vis.length-1)?"Finish":"Next";
  updateProgressUI();
}

/* ===== Nav ===== */
function validateCurrent(){
  const vis=visibleSteps(); const q=findQuestion(vis[currentIndex]);
  return q?.required ? isAnswered(q) : true;
}
function nextQ(){
  if(!validateCurrent()){ setHint("Please answer before continuing."); return; }
  const vis=visibleSteps();
  if(currentIndex<vis.length-1){ currentIndex++; render(); }
  else{ showSummary(); }
}
function prevQ(){ if(currentIndex>0){ currentIndex--; render(); } }

/* ===== Share / CTA ===== */
function computeShareLink(){
  const rid=Math.random().toString(36).slice(2,10);
  return `${location.origin}${location.pathname}?partner=${rid}`;
}
function showShareForInitiator(link){
  if(isPartner){ shareBlock.style.display="none"; return; }
  shareBlock.style.display="block";
  shareInput.value=link;
  copyBtn.onclick=async()=>{
    try{ await navigator.clipboard.writeText(link); alert("Link copied!"); }
    catch(e){ shareInput.select(); document.execCommand('copy'); alert("Link copied!"); }
  };
  waBtn.href="https://wa.me/?text="+encodeURIComponent(link);
  smsBtn.href="sms:?&body="+encodeURIComponent(link);
}
function showPartnerCTA(){
  partnerCTA.style.display=isPartner?"block":"none";
  letsGoBtn.onclick=()=>{
    /* Branche ici ton fetch() backend pour envoyer les emails en arrière-plan */
    alert("We’ll email both of you your compatibility result. ✨");
  };
}

/* ===== Summary ===== */
function showSummary(){
  elQBox.style.display="none";
  document.getElementById("nav-buttons").style.display="none";
  elBar.style.width="100%"; elPct.textContent="100% complete";

  const vis=visibleSteps();
  const wrap=document.createElement("div"); wrap.className="summary";
  const h=document.createElement("h3"); h.textContent="Your answers";
  wrap.appendChild(h);

  vis.forEach(id=>{
    const q=findQuestion(id); let val=state[id];
    const row=document.createElement("div"); row.className="row";
    const k=document.createElement("div"); k.className="k"; k.textContent=q.label;
    const v=document.createElement("div"); v.className="v";
    if(Array.isArray(val)) val=val.join(", "); if(!val) val="—";
    v.textContent = val; row.appendChild(k); row.appendChild(v); wrap.appendChild(row);
  });

  elSummary.innerHTML=""; elSummary.appendChild(wrap); elSummary.style.display="block";

  const link=computeShareLink();       // Initiateur : boutons de partage
  showShareForInitiator(link);
  showPartnerCTA();                    // Partenaire : bouton “Let’s Go”
}

/* ===== Init ===== */
function safeInit(){ try{ render(); }catch(e){ console.error(e); elQTitle.textContent="Init error."; } }
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded", safeInit); }
else{ safeInit(); }

/* Expose */
window.nextQ=nextQ; window.prevQ=prevQ;
</script>
</body>
</html>

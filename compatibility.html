<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Compatibility Test — Match or Move On</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0b0b0d; --text:#e9e2db; --muted:#c9c2bb; --rose:#ff3b30; --glass:rgba(255,255,255,.04); }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;color:var(--text);overflow-x:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg)}
  html{scroll-behavior:smooth}

  /* Layout */
  .wrap{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:120px 16px 96px}
  .page{max-width:min(780px,94vw);width:100%}
  h1{font-family:"Playfair Display",serif;text-align:center;margin:0 0 6px}
  .lead{color:var(--muted);text-align:center;margin:4px 0 22px}
  .intro{color:var(--muted);text-align:center;margin:0 0 18px;font-size:0.98rem}

  /* Progress */
  .progress{width:100%;height:10px;background:#1b1b1d;border-radius:999px;overflow:hidden;margin:0 0 8px;border:1px solid rgba(255,255,255,.08)}
  .progress-bar{height:100%;width:0;background:var(--rose);transition:width .35s ease}
  .progress-meta{font-size:.9rem;color:#bfb7b0;text-align:right;margin:0 0 16px}
  .q-index{display:block;color:#bfb7b0;font-size:.9rem;margin-bottom:6px}

  /* Card */
  .question-box{background:var(--glass);border:1px solid rgba(255,255,255,.10);border-radius:18px;
    padding:24px 18px;margin-bottom:14px;box-shadow:0 0 14px rgba(255,59,48,.12), inset 0 0 12px rgba(255,255,255,.04)}
  .section-title{font-family:"Playfair Display",serif;font-size:clamp(18px,3.6vw,24px);margin:0 0 12px;color:#fff}
  .q-title{font-weight:600;margin:12px 0 8px}

  /* Inputs */
  input[type="text"], input[type="email"], select{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.10);
    background:#111214;color:#fff;font-size:1rem;outline:none
  }
  .options{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:10px;background:#121215;border:1px solid rgba(255,255,255,.08);padding:10px 12px;border-radius:12px}
  .opt input{appearance:none;width:18px;height:18px;border:2px solid #666;border-radius:50%;position:relative;cursor:pointer;background:transparent}
  .opt input:checked{border-color:var(--rose)}
  .opt input:checked::after{content:"";position:absolute;top:50%;left:50%;width:8px;height:8px;border-radius:50%;background:var(--rose);transform:translate(-50%,-50%)}
  .opt.multi input{border-color:#666}
  .opt.multi input:checked::after{width:10px;height:10px}
  .opt label{flex:1;cursor:pointer}
  .hint{font-size:.9rem;color:#bfb7b0;margin-top:6px}

  /* Buttons (transparent like site nav hover) */
  .nav-buttons{display:flex;gap:12px;margin-top:10px}
  .btn{flex:1;background:transparent;color:var(--rose);border:2px solid var(--rose);border-radius:12px;padding:12px 14px;
    font-size:1rem;font-weight:700;cursor:pointer;transition:all .25s}
  .btn:hover{background:var(--rose);color:#fff;transform:translateY(-1px);box-shadow:0 6px 15px rgba(0,0,0,.25)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.secondary{opacity:1}

  /* Summary */
  .summary{display:none;background:var(--glass);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:18px;margin-top:16px}
  .summary h3{margin:0 0 8px;font-family:"Playfair Display",serif}
  .row{display:flex;gap:10px;border-bottom:1px dashed rgba(255,255,255,.08);padding:8px 0}
  .row:last-child{border-bottom:none}
  .k{color:#bfb7b0;min-width:220px}
  .v{flex:1}

  @media (max-width:768px){ .wrap{padding-top:100px} .k{min-width:150px} }
</style>
</head>
<body>
<main class="wrap">
  <section class="page">
    <h1>Compatibility Test</h1>
    <p class="lead">Check real-world compatibility with your crush, partner, or someone new — softly, step by step.</p>
    <p class="intro">Here you can compare values, lifestyle, goals, and deal-breakers. Answer honestly — we’ll summarize everything for you at the end.</p>

    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <div class="progress-meta" id="meta">0.0% complete</div>

    <div class="question-box" id="box">
      <small class="q-index" id="idx">Question 1 / 1</small>
      <h2 class="section-title" id="section">Loading…</h2>
      <div id="inputs"></div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="nav-buttons">
      <button class="btn secondary" id="prev" onclick="prevStep()">Back</button>
      <button class="btn" id="next" onclick="nextStep()">Next</button>
    </div>

    <div class="summary" id="summary"></div>
  </section>
</main>

<script>
/* ===================== COMPATIBILITY WIZARD ===================== */
/* Code en anglais, logique claire, même look que ton site. */

/* Countries (ISO common names) */
const COUNTRIES = [
"Afghanistan","Albania","Algeria","Andorra","Angola","Antigua and Barbuda","Argentina","Armenia","Australia","Austria",
"Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia",
"Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cabo Verde","Cambodia","Cameroon",
"Canada","Central African Republic","Chad","Chile","China","Colombia","Comoros","Congo","Costa Rica","Côte d’Ivoire",
"Croatia","Cuba","Cyprus","Czech Republic","Democratic Republic of the Congo","Denmark","Djibouti","Dominica","Dominican Republic",

"Gabon","Gambia","Georgia","Germany","Ghana","Greece","Grenada","Guatemala","Guinea","Guinea-Bissau","Guyana",
"Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan",
"Jordan","Kazakhstan","Kenya","Kiribati","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya",
"Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Marshall Islands",
"Mauritania","Mauritius","Mexico","Micronesia","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar",
"Namibia","Nauru","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway",
"Oman","Pakistan","Palau","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania",
"Russia","Rwanda","Saint Kitts and Nevis","Saint Lucia","Saint Vincent and the Grenadines","Samoa","San Marino",
"Sao Tome and Principe","Saudi Arabia","Senegal","Serbia","Seychelles","Sierra Leone","Singapore","Slovakia","Slovenia",
"Solomon Islands","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden",
"Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Timor-Leste","Togo","Tonga","Trinidad and Tobago",
"Tunisia","Turkey","Turkmenistan","Tuvalu","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States",

const ASTRO = [
  "Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces","I don’t follow astrology"
];

/* ===================== FULL QUESTION SET ===================== */
/* Includes ALL Love Passport questions (no photo) + Email + Hygiene/Living/Car/Finance additions. */
const QUESTIONS = [
  // Identity & Basics
  {id:"fullName", type:"text",  label:"Please enter your full name", required:true, placeholder:"First and last name"},
  {id:"email",    type:"text",  label:"Email (required — results can be sent here)", required:true, placeholder:"you@example.com", validate:"email"},
  {id:"gender",   type:"select",label:"Your gender", required:true, options:["Man","Woman","Non-binary","Trans man","Trans woman","Intersex"]},
  {id:"age",      type:"select",label:"How old are you?", required:true, options:(()=>{const a=[];for(let i=18;i<=60;i++)a.push(String(i));a.push("60+");return a;})()},
  {id:"residency",type:"select",label:"Country of residence", required:true, options:COUNTRIES},
  {id:"origin",   type:"select",label:"Country of origin", required:true, options:COUNTRIES},
  {id:"instagram",type:"text",  label:"Instagram (optional)", required:false, placeholder:"@yourhandle"},
  {id:"languages",type:"multi", label:"Languages you speak (pick ≥ 1)", required:true, min:1,
    options:["English","French","Spanish","Portuguese","Arabic","Chinese","Hindi","German","Turkish","Russian","Swahili"]},
  {id:"marital",  type:"single",label:"Current marital status", required:true, options:["Single","Married","Divorced","Widowed","It’s complicated"]},
  {id:"politics", type:"single",label:"Political outlook", required:true,
    options:["Conservative / right-leaning","Progressive / left-leaning","Centrist / mixed","Not politically engaged"]},
  {id:"astro",    type:"select",label:"Zodiac sign (optional)", required:true, options:ASTRO},
  {id:"height",   type:"text",  label:"Height (optional)", required:false, placeholder:"170 cm / 5’7”"},
  {id:"job",      type:"text",  label:"Occupation", required:true, placeholder:"e.g., Nurse, Engineer, Freelancer"},

  // Money & Roles (use your exact wording)
  {id:"money", type:"single", label:"How would you prefer to manage finances as a couple?", required:true,
    options:["One joint account (i love sharing everything)","Separate accounts"]},
  {id:"role",  type:"single", label:"Which type of relationship dynamic do you prefer?", required:true,
    options:["Traditional roles (Man provides fully, woman manages the home)",
             "Independent partners but not equal (Man covers bit more e.g 75/25)",
             "Balanced 50/50 (Equal financial and household contribution)"]},
  {id:"housework", type:"single", label:"How would you like to divide household duties?", required:true,
    options:["I handle most home tasks","Shared equally","Prefer hiring help"]},
  {id:"cooking",   type:"single", label:"How comfortable are you with cooking in daily life?", required:true,
    options:["I don’t know how to cook and i don't want to",
             "i don't know how to cook, but i'm Willing to learn",
             "Can cook basics","Confident cook"]},

  // Kids
  {id:"hasKids",   type:"single", label:"Do you have children?", required:true, options:["No","Yes"]},
  {id:"kidsCount", type:"select", label:"How many children do you have?", required:true,
    options:["1","2","3","4","5+"], showIf:{id:"hasKids", value:"Yes"}},
  {id:"kidsWith",  type:"single", label:"If you have multiple children, were they with the same partner or different partners?", required:true,
    options:["Same partner","Different partners"], showIf:{id:"kidsCount", anyOf:["2","3","4","5+"]}},
  {id:"wantKids",  type:"single", label:"Do you want children in the future?", required:true, options:["Yes","Not sure","No"]},
  {id:"kidsTime",  type:"single", label:"If you want children, what timeline feels most aligned with you?", required:false,
    options:["1–2 years","3–5 years",">5 years","When it happens"], showIf:{id:"wantKids", value:"Yes"}},

  // Faith & culture
  {id:"religionAff", type:"single",label:"Religion or spiritual affiliation", required:true,
    options:["Muslim (practicing)","Muslim (not practicing)","Christian (practicing)","Christian (not practicing)","Buddhist","Hindu","Vodun","Atheist"]},
  {id:"crossCulture",type:"single",label:"Would you consider a serious relationship with someone from a different culture than yours?", required:true,
    options:["Yes","Maybe","No"]},

  // Lifestyle basics
  {id:"smoking", type:"single",label:"Do you smoke?", required:true, options:["No","Sometimes","Daily"]},
  {id:"alcohol", type:"single",label:"Do you drink?", required:true, options:["No","Sometimes","yes"]},
  {id:"diet",    type:"single",label:"Food & dietary practice", required:true,
    options:["I eat everything","Halal","Vegetarian/Vegan","Pescatarian","Other"]},
  {id:"fitness", type:"single",label:"How active are you, generally?", required:true,
    options:["Gym 3+ times/week","Active sometimes","Rarely","I hate the gym"]},

  // >>> Compatibility additions: Hygiene & Home
  {id:"homeTidy", type:"single", label:"How would you describe your home care habits?", required:true, options:[
    "Very tidy — I clean and organize regularly",
    "Generally tidy — I clean weekly",
    "Sometimes messy — I clean when I can",
    "I don't prioritize cleaning much"
  ]},
  {id:"grooming", type:"single", label:"Personal hygiene & grooming", required:true, options:[
    "High standard — daily shower, regular grooming",
    "Moderate — consistent but low-maintenance",
    "Minimal — I don't focus much on grooming",
    "Fragrance-free / sensitive-skin approach"
  ]},

  // Relationship model
  {id:"loyalty", type:"single",label:"Relationship model", required:true,
    options:["Monogamy only","Polygamy only","Open relationship"]},

  // Love languages & feelings (LP version kept)
  {id:"feelLoved", type:"multi", label:"I feel loved when… (pick ≥ 2)", required:true, min:2,
    options:["I hear kind, affirming words","We spend quality time","My partner shows affection (touch)","I receive thoughtful gifts","My partner gives me money","My partner does helpful actions for me","I am prioritized in their plans"]},
  {id:"showLove",  type:"multi", label:"How I show love (pick ≥ 2)", required:true, min:2,
    options:["I give gifts","I give money","I plan quality time","I am affectionate (touch)","I use loving words","I do helpful actions"]},

  // Ambition & energy
  {id:"ambition",       type:"single",label:"what comes first for you: love or ambition?", required:true,
    options:["Money first, then love","Love first, then money","Both hand in hand"]},
  {id:"partnerSuccess", type:"single",label:"If your partner becomes far more successful than you, how would you feel?", required:true,
    options:["Proud — it’s our win","Happy and motivated too","I’d feel uncomfortable with that"]},
  {id:"conflict",       type:"single",label:"When conflicts happen, how do you usually respond?", required:true,
    options:["Talk it through calmly","Take a pause, then talk","I raise my voice","I walk away to cool off"]},
  {id:"energy",         type:"single",label:"Which best describes your social energy?", required:true,
    options:["Introvert","Extrovert","Ambivert"]},

  // Goals & logistics (LP)
  {id:"relGoals",  type:"multi", label:"What are you looking for? (pick ≥ 1)", required:true, min:1,
    options:["Serious relationship","Marriage soon","Marriage someday","Casual dating","Friendship first"]},
  {id:"marriage",  type:"single",label:"When would you like to get married?", required:true,
    options:["In 1–2 years","In 3+ years","I’m not focused on marriage"]},
  {id:"distance",  type:"single",label:"Would you consider a long-distance relationship?", required:true, options:["Yes","Maybe","No"]},
  {id:"relocate",  type:"single",label:"Would you relocate internationally for a partner?", required:true, options:["Yes","Maybe","No"]},

  // Ideal evening (extended with your romantic adds)
  {id:"evening",   type:"single",label:"How would you spend an ideal evening with someone you love", required:true, options:[
    "A cozy movie night at home",
    "A romantic dinner out & deep conversation",
    "Going out for live music or a performance as a couple",
    "A peaceful romantic walk on the beach",
    "Watching a movie together at the theater"
  ]},

  // Travel
  {id:"travelLike",  type:"single",label:"Do you enjoy traveling?", required:true, options:["Yes","No"]},
  {id:"favCountry",  type:"select",label:"What's your favorite country to visit", required:true, options:COUNTRIES},
  {id:"dreamCountry",type:"select",label:"What country do you dream of visiting", required:true, options:COUNTRIES},

  // Pets (own + comfort)
  {id:"ownPets",   type:"single",label:"Do you have any pets?", required:true, options:["No","Yes"]},
  {id:"petType",   type:"single",label:"If you have pets, which type?", required:true, options:["Dog","Cat","Both","Other"], showIf:{id:"ownPets", value:"Yes"}},
  {id:"petCount",  type:"select",label:"How many pets do you have?", required:true, options:["1","2","3","4","5+"], showIf:{id:"ownPets", value:"Yes"}},
  {id:"petComfort",type:"single",label:"Would you be comfortable living with a partner who has pets?", required:true,
    options:["Yes — I’m comfortable living with pets","No — I can’t live with pets","I am allergic to pets","I don’t want pets in my home"]},

  // Lifestyle details
  {id:"sleep",   type:"single",label:"Your sleep rhythm", required:true, options:["Early sleeper","Night owl","Flexible (depends)"]},
  {id:"success", type:"single",label:"What does success mean to you?", required:true,
    options:["Financial independence","Building a family (spouse & children)","Creating a successful business","Being deeply aligned with my religion"]},

  // >>> Compatibility additions: Living / Own place / Car / Finance
  {id:"living",      type:"single",label:"What is your current living arrangement?", required:true, options:[
    "I live alone (renting)","I live alone (owned)","I live with roommates","I live with my parents/family","Student housing / temporary","Other"
  ]},
  {id:"ownPlace",    type:"single",label:"Do you currently have your own place?", required:true, options:[
    "Yes — I rent","Yes — I own","No — I live with family","No — shared housing / roommates"
  ]},
  {id:"car",         type:"single",label:"Do you have a car?", required:true, options:["Yes","No","Not necessary where I live"]},
  {id:"finStability",type:"single",label:"How would you describe your financial stability?", required:true, options:[
    "Stable — I save monthly","Stable — mostly break even","In transition (building back up)","Prefer not to say"
  ]},

  // Privacy & social + Intimacy + Deal-breakers
  {id:"phonePrivacy", type:"single",label:"Phone privacy in a relationship", required:true,
    options:["My phone is private, I don’t share passwords","I can share passwords if needed","My phone is fully open, no restrictions"]},
  {id:"socialPosting",type:"single",label:"How do you feel about sharing your relationship on social media?", required:true,
    options:["I want to post our couple photos freely","I prefer not posting couple photos at all","I’m fine if my partner posts, but I won’t post much","I don’t care, it’s not important to me"]},
  {id:"dmRules",      type:"single",label:"DM boundaries and private conversations", required:true,
    options:["Friendly DMs are okay (opposite sex included)","Only respectful/professional DMs are fine","No private DMs with the opposite sex at all"]},
  {id:"intimacy",     type:"single",label:"Preferred pace for physical intimacy", required:true,
    options:["Very slowly (weeks/months)","Normal rhythm (we see how it goes)","Fast (early if chemistry)","Only after marriage"]},

  {id:"dealBreakers", type:"multi", label:"I cannot accept… (pick ≥ 2)", required:true, min:2, options:[
    "Very different political opinions from mine",
    "Religion not aligned with mine",
    "Tries to change my faith/practice",
    "Cheating / infidelity",
    "Jealous / possessive / controlling",
    "Violence (physical, verbal, emotional)",
    "Explosive temper / unmanaged anger",
    "Disrespects waiters/service workers; lacks humility",
    "Already has children",
    "Has children with different partners",
    "Partner owns pets (dogs/cats) — I can’t handle it",
    "Big income gap — earns much less than me",
    "Big income gap — earns much more than me",
    "Sharing my private life on social media without my consent",
    "Doesn’t take care of health ( Gym and eating healthy )",
    "Someone who is not family-oriented ( no close bond with parents or siblings)",
    "Someone obsessed with politics"
  ]},

  // About me last
  {id:"about", type:"text", label:"About me (3–6 sentences)", required:false, placeholder:"Write a short description"}
];

/* ===== Step grouping (wizard) ===== */
const STEPS = [
  // Step 1 — Identity essentials
  ["fullName","email","gender","age","residency","origin","instagram","languages","marital","politics","astro","height","job"],
  // Step 2 — Money & roles
  ["money","role","housework","cooking"],
  // Step 3 — Kids & family
  ["hasKids","kidsCount","kidsWith","wantKids","kidsTime","religionAff","crossCulture"],
  // Step 4 — Lifestyle + Hygiene
  ["smoking","alcohol","diet","fitness","homeTidy","grooming"],
  // Step 5 — Relationship model & feelings
  ["loyalty","feelLoved","showLove"],
  // Step 6 — Ambition & energy
  ["ambition","partnerSuccess","conflict","energy"],
  // Step 7 — Goals & logistics + Ideal evening
  ["relGoals","marriage","distance","relocate","evening"],
  // Step 8 — Travel & Pets
  ["travelLike","favCountry","dreamCountry","ownPets","petType","petCount","petComfort"],
  // Step 9 — Lifestyle details + Living/Car/Finance
  ["sleep","success","living","ownPlace","car","finStability"],
  // Step 10 — Privacy/Social/Intimacy/Deal breakers/About
  ["phonePrivacy","socialPosting","dmRules","intimacy","dealBreakers","about"]
];

/* ===== State & Refs ===== */
const state = {};
let stepIndex = 0;

const elBar=document.getElementById('bar');
const elMeta=document.getElementById('meta');
const elIdx=document.getElementById('idx');
const elSection=document.getElementById('section');
const elInputs=document.getElementById('inputs');
const elHint=document.getElementById('hint');
const elSummary=document.getElementById('summary');
const btnPrev=document.getElementById('prev');
const btnNext=document.getElementById('next');

/* ===== Helpers ===== */
function findQuestion(id){ return QUESTIONS.find(q=>q.id===id); }
function isEmail(x){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(x||"").trim()); }

function isVisible(q){
  if(!q.showIf) return true;
  const v = state[q.showIf.id];
  if(q.showIf.value!==undefined) return v===q.showIf.value;
  if(q.showIf.anyOf) return q.showIf.anyOf.includes(v);
  return true;
}
function visibleInStep(ids){ return ids.filter(id=>{ const q=findQuestion(id); return q ? isVisible(q) : false; }); }
function allVisibleIds(){ return STEPS.flatMap(visibleInStep); }

function sectionName(i){
  return [
    "Identity","Money & Roles","Kids & Culture","Lifestyle & Hygiene",
    "Relationship Model & Feelings","Ambition & Energy","Goals & Logistics",
    "Travel & Pets","Living, Car & Finance","Privacy, Intimacy & Deal Breakers"
  ][i] || "Step";
}

/* Progress based on question count (global, not per step) */
function questionNumberAtStep(){
  let n = 0;
  for(let i=0;i<stepIndex;i++){ n += visibleInStep(STEPS[i]).length; }
  return Math.min(n+1, Math.max(1, allVisibleIds().length));
}
function percentAtStep(){
  const total = allVisibleIds().length;
  if(total<=1) return 100;
  const n = questionNumberAtStep();
  return ((n-1)/(total-1))*100;
}

/* ===== Render ===== */
function render(){
  const ids = visibleInStep(STEPS[stepIndex]);
  elInputs.innerHTML = "";
  elHint.textContent = "";

  // Section title
  elSection.textContent = sectionName(stepIndex);

  // Progress
  const totalQs = allVisibleIds().length;
  const qNum = questionNumberAtStep();
  const pct = percentAtStep();

  elBar.style.width = pct + "%";
  elMeta.textContent = pct.toFixed(1) + "% complete";
  elIdx.textContent = `Question ${qNum} / ${totalQs}`;

  // Fields
  ids.forEach(id=>{
    const q = findQuestion(id);
    if(!q) return;

    const group=document.createElement('div');
    const h=document.createElement('div');
    h.className='q-title';
    h.textContent=q.label;
    group.appendChild(h);

    if(q.type==="single"){
      const wrap=document.createElement('div'); wrap.className='options';
      q.options.forEach(opt=>{
        const row=document.createElement('div'); row.className='opt';
        const input=document.createElement('input'); input.type='radio'; input.name=q.id; input.value=opt;
        if(state[q.id]===opt) input.checked=true;
        input.addEventListener('change',()=>{ state[q.id]=opt; });
        const lab=document.createElement('label'); lab.textContent=opt; lab.addEventListener('click',()=>{ input.checked=true; input.dispatchEvent(new Event('change')); });
        row.appendChild(input); row.appendChild(lab); wrap.appendChild(row);
      });
      group.appendChild(wrap);
    }
    else if(q.type==="multi"){
      const wrap=document.createElement('div'); wrap.className='options';
      const sel=new Set(Array.isArray(state[q.id])?state[q.id]:[]);
      q.options.forEach(opt=>{
        const row=document.createElement('div'); row.className='opt multi';
        const input=document.createElement('input'); input.type='checkbox'; input.value=opt;
        if(sel.has(opt)) input.checked=true;
        input.addEventListener('change',()=>{ input.checked?sel.add(opt):sel.delete(opt); state[q.id]=Array.from(sel); });
        const lab=document.createElement('label'); lab.textContent=opt; lab.addEventListener('click',()=>{ input.checked=!input.checked; input.dispatchEvent(new Event('change')); });
        row.appendChild(input); row.appendChild(lab); wrap.appendChild(row);
      });
      if(q.min) elHint.textContent=`Pick at least ${q.min}.`;
      group.appendChild(wrap);
    }
    else if(q.type==="select"){
      const sel=document.createElement('select');
      const def=document.createElement('option'); def.value=""; def.textContent="Select…"; sel.appendChild(def);
      q.options.forEach(o=>{const op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op);});
      if(state[q.id]) sel.value=state[q.id];
      sel.addEventListener('change',e=>state[q.id]=e.target.value);
      group.appendChild(sel);
    }
    else if(q.type==="text"){
      const inp=document.createElement('input');
      inp.type = (q.validate==="email") ? "email" : "text";
      inp.placeholder=q.placeholder||"";
      if(state[q.id]) inp.value=state[q.id];
      inp.addEventListener('input',e=>state[q.id]=e.target.value);
      group.appendChild(inp);
    }

    elInputs.appendChild(group);
  });

  btnPrev.disabled = (stepIndex===0);
  btnNext.textContent = (stepIndex===STEPS.length-1) ? "Finish" : "Next";
}

/* ===== Validation ===== */
function validateStep(){
  const ids = visibleInStep(STEPS[stepIndex]);
  for(const id of ids){
    const q=findQuestion(id);
    if(!q || !q.required) continue;
    const v=state[id];
    if(q.type==="multi"){
      if(!Array.isArray(v) || v.length<(q.min||1)){
        elHint.textContent="Please answer before continuing.";
        return false;
      }
    }else{
      if(!v){
        elHint.textContent="Please answer before continuing.";
        return false;
      }
      if(q.validate==="email" && !isEmail(v)){
        elHint.textContent="Please enter a valid email address.";
        return false;
      }
    }
  }
  elHint.textContent="";
  return true;
}

/* ===== Nav ===== */
function nextStep(){
  if(!validateStep()) return;
  if(stepIndex<STEPS.length-1){
    stepIndex++; render();
  }else{
    showSummary();
  }
}
function prevStep(){ if(stepIndex>0){ stepIndex--; render(); } }

/* ===== Summary ===== */
function showSummary(){
  document.getElementById('box').style.display='none';
  document.querySelector('.nav-buttons').style.display='none';
  elBar.style.width='100%'; elMeta.textContent='100.0% complete'; elIdx.textContent='';

  const wrap=elSummary; wrap.innerHTML='';
  const h=document.createElement('h3'); h.textContent='Your Compatibility Answers'; wrap.appendChild(h);

  const allIds=allVisibleIds();
  allIds.forEach(id=>{
    const q=findQuestion(id); if(!q) return;
    // Skip hidden ones by showIf dependency
    if(q.showIf){
      const vdep = state[q.showIf.id];
      if(q.showIf.value!==undefined && vdep!==q.showIf.value) return;
      if(q.showIf.anyOf && !q.showIf.anyOf.includes(vdep)) return;
    }
    let val=state[id];
    if(Array.isArray(val)) val=val.join(', ');
    if(!val) val='—';
    const row=document.createElement('div'); row.className='row';
    const k=document.createElement('div'); k.className='k'; k.textContent=q.label;
    const v=document.createElement('div'); v.className='v'; v.textContent=val;
    row.appendChild(k); row.appendChild(v); wrap.appendChild(row);
  });

  // CTA Button (same style)
  const cta=document.createElement('div'); cta.style.marginTop='14px';
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='Save / Export Answers';
  btn.addEventListener('click',()=>alert('Export coming next ✨'));
  cta.appendChild(btn); wrap.appendChild(cta);

  wrap.style.display='block';
}

/* ===== Init ===== */
function safeInit(){ try{ render(); }catch(e){ console.error(e); elSection.textContent="Error loading the first step."; } }
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', safeInit); } else { safeInit(); }

/* Expose */
window.nextStep=nextStep; window.prevStep=prevStep;
</script>
</body>
</html>

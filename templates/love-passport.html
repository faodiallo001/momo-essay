<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Love Passport — A6 Vector PDF (Clean)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b0d;--ink:#f2ece7;--mut:#c9c2bb;--rose:#ff3b30}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .bar{position:sticky;top:0;z-index:3;display:flex;gap:10px;justify-content:center;padding:10px;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(#0b0b0d,rgba(11,11,13,.5))}
  .btn{background:transparent;color:var(--rose);border:1px solid var(--rose);padding:9px 12px;border-radius:999px;font-weight:700;cursor:pointer}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .wrap{max-width:1100px;margin:16px auto;padding:0 10px}
  .cap{font-size:12px;color:var(--mut);text-align:center;margin:8px 0}
  .grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  /* aperçu A6 écran */
  .card{width:297px;height:420px;background:#000;border-radius:12px;overflow:hidden;
        box-shadow:0 12px 28px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06)}
</style>
</head>
<body>

<div class="bar">
  <button class="btn" id="dl" disabled>Download Love Passport (A6 PDF)</button>
</div>

<div class="wrap">
  <div class="cap">Vector preview (SVG) — what you see goes to PDF (A6)</div>
  <div class="grid" id="gallery"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/svg2pdf.js@2.2.3/dist/svg2pdf.min.js" crossorigin="anonymous"></script>

<script>
/* ================= DATA (exemple) ================= */
const DATA = {
  lpid: 'LP-23A9-7XQ4',
  fullName: 'Amina K.',
  ageCountry: '25 • Brazil',
  religion: 'Muslim (practicing)',
  langs: 'English, French, Portuguese',
  origin: 'Benin',
  residency: 'São Paulo',
  marital: 'Single',
  kids: 'No',
  faith: 'Central',
  prayer: 'Daily',
  workStyle: 'Hard-working, builder',
  fitness: 'Gym 3×/week',
  smoke: 'No',
  alcohol: 'No',
  diet: 'No pork',
  hobbies: ['Working','Shopping','Social media','Music','Travel'],
  dealBreakers: 'Smokes, never exercises, heavy drinker, disrespects faith, constant jealousy, financial irresponsibility.',
  signedOn: new Date().toISOString().slice(0,10),
  photoUrl: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=900&auto=format&fit=crop'
};

/* ================= CONST ================= */
const MM_TO_PT = 72/25.4;
const A6 = { w_mm:105, h_mm:148, w_pt:105*MM_TO_PT, h_pt:148*MM_TO_PT };
const PREVIEW = { w:297, h:420 };

/* ================= HELPERS ================= */
async function toDataURL(url){
  try{
    const res = await fetch(url,{mode:'cors'}); const blob = await res.blob();
    return await new Promise(ok=>{const r=new FileReader(); r.onload=()=>ok(r.result); r.readAsDataURL(blob);});
  }catch(e){return null;}
}
function svgEl(name, attrs={}){const el=document.createElementNS('http://www.w3.org/2000/svg',name); for(const[k,v]of Object.entries(attrs)) el.setAttribute(k,v); return el;}
function t(parent,x,y,txt,opts={}){const el=svgEl('text',{x,y,fill:opts.fill||'#f2ece7','font-family':opts.ff||'Inter, Arial','font-size':opts.fs||'12','font-weight':opts.fw||'600','letter-spacing':opts.ls||'0'}); el.textContent=txt; parent.appendChild(el); return el;}
function badge(parent,x,y,txt){const padX=10,padY=7,fs=12;const g=svgEl('g');parent.appendChild(g);const temp=t(g,x+padX,y+fs+padY-2,txt,{fs,fw:'600',fill:'#eee'});const w=txt.length*fs*0.6+padX*2,h=fs+padY*2;const r=svgEl('rect',{x,y,rx:12,ry:12,width:w,height:h,fill:'rgba(255,255,255,.03)',stroke:'rgba(255,255,255,.18)'});g.insertBefore(r,temp);return w+8;}
function glossyBackground(defs){const lg=svgEl('linearGradient',{id:'gloss',x1:'0%',y1:'0%',x2:'100%',y2:'100%'});lg.appendChild(svgEl('stop',{offset:'0%','stop-color':'rgba(255,255,255,0.08)'}));lg.appendChild(svgEl('stop',{offset:'45%','stop-color':'rgba(255,255,255,0)'}));defs.appendChild(lg);}
function heartGrad(defs){const rg=svgEl('radialGradient',{id:'hgrad',cx:'50%',cy:'38%',r:'55%'});rg.appendChild(svgEl('stop',{offset:'0%','stop-color':'#ff9790'}));rg.appendChild(svgEl('stop',{offset:'40%','stop-color':'#ff3b30'}));rg.appendChild(svgEl('stop',{offset:'85%','stop-color':'#8e1712'}));defs.appendChild(rg);}

/* ====== Tampon DENIED (rectangle incliné) ====== */
function stampDenied(parent, x, y, rot = -10){
  const g = svgEl('g',{transform:`translate(${x},${y}) rotate(${rot})`, opacity:'0.9'});
  const w=78,h=22,r=5;
  g.appendChild(svgEl('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:r,ry:r,fill:'rgba(255,59,48,.12)',stroke:'#ff3b30','stroke-width':'1.6'}));
  const lab=t(g,0,5,'DENIED',{fs:12,fw:'800',fill:'#ff3b30'}); lab.setAttribute('text-anchor','middle');
  parent.appendChild(g);
}

/* ================= PAGES ================= */
// 1 — Cover
function pageCover(){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs=svgEl('defs'); svg.appendChild(defs); glossyBackground(defs); heartGrad(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#020203'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg,s.w/2,78,'LOVE PASSPORT',{fs:24,fw:'800',ff:'Playfair Display, serif',fill:'#ff3b30'}).setAttribute('text-anchor','middle');
  const g=svgEl('g',{transform:`translate(${s.w/2},${s.h/2+6})`});
  const path='M0,58 L-48,8 A30,30 0 0 1 0,-20 A30,30 0 0 1 48,8 Z';
  g.appendChild(svgEl('path',{d:path,fill:'url(#hgrad)'})); svg.appendChild(g);
  t(svg,s.w/2,s.h-64,`LPID: ${DATA.lpid}`,{fs:12,fw:'800'}).setAttribute('text-anchor','middle');
  return svg;
}

// 2 — Profile & Identity
function pageIdentity(photoDataUrl){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs=svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#050506'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg,20,36,'Profile & Identity',{fs:17,fw:'800',ff:'Playfair Display, serif',fill:'#ff3b30'});
  const avatar=60;
  if(photoDataUrl){
    const ph=svgEl('image',{href:photoDataUrl,x:20,y:48,width:avatar,height:avatar,preserveAspectRatio:'xMidYMid slice'});
    svg.appendChild(svgEl('rect',{x:20,y:48,width:avatar,height:avatar,rx:10,ry:10,fill:'none',stroke:'rgba(255,255,255,.22)'})); svg.appendChild(ph);
  } else {
    svg.appendChild(svgEl('rect',{x:20,y:48,width:avatar,height:avatar,rx:10,ry:10,fill:'rgba(255,255,255,.06)',stroke:'rgba(255,255,255,.22)'}));
    t(svg,50,82,'PHOTO',{fs:11,fw:'800'}).setAttribute('text-anchor','middle');
  }
  t(svg,20+avatar+12,66,DATA.fullName,{fs:17,fw:'800'});
  t(svg,20+avatar+12,86,DATA.ageCountry,{fs:13,fw:'700',fill:'#e0dad3'});

  const x1=20,x2=150,top=124,lh=24,kf={fs:13,fw:'600',fill:'#c9c2bb'},vf={fs:13,fw:'800'};
  [['Religion',DATA.religion],['LPID',DATA.lpid],['Languages',DATA.langs],
   ['Origin',DATA.origin],['Lives in',DATA.residency],['Marital',DATA.marital],['Kids',DATA.kids]
  ].forEach((r,i)=>{t(svg,x1,top+i*lh,r[0],kf); t(svg,x2,top+i*lh,r[1],vf);});
  return svg;
}

// 3 — Values & Lifestyle
function pageValues(){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs=svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#050506'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg,20,36,'Values & Lifestyle',{fs:17,fw:'800',ff:'Playfair Display, serif',fill:'#ff3b30'});
  const x1=20,x2=170,top=68,lh=24,kf={fs:13,fw:'600',fill:'#c9c2bb'},vf={fs:13,fw:'800'};
  [['Faith',DATA.faith],['Prayer',DATA.prayer],['Work style',DATA.workStyle],
   ['Fitness',DATA.fitness],['Smoking',DATA.smoke],['Alcohol',DATA.alcohol],['Diet',DATA.diet]
  ].forEach((r,i)=>{t(svg,x1,top+i*lh,r[0],kf); t(svg,x2,top+i*lh,r[1],vf);});
  t(svg,20, top+lh*8, 'Hobbies', {fs:15,fw:'800',ff:'Playfair Display, serif',fill:'#ff3b30'});
  let x=20, y=top+lh*8+12;
  DATA.hobbies.forEach(h=>{const w=badge(svg,x,y,h); x+=w; if(x> s.w-110){x=20; y+=34;}});
  return svg;
}

// 4 — Deal Breakers (avec tampons DENIED)
function pageDeal(){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs=svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#050506'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg,20,36,'Deal Breakers',{fs:17,fw:'800',ff:'Playfair Display, serif',fill:'#ff3b30'});

  const items = DATA.dealBreakers.split(',').map(s=>s.trim()).filter(Boolean);
  const startY=70, step=34;

  items.forEach((txt,idx)=>{
    const y = startY + idx*step;
    // tampon "DENIED" à gauche
    stampDenied(svg, 40, y-8, idx%2 ? 12 : -12);
    // texte
    t(svg, 70, y, txt, {fs:13, fw:'700'});
  });

  return svg;
}

// 5 — Verify & Share (date + QR tout en bas)
function pageVerify(){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs=svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#050506'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg,20,36,'Verify & Share',{fs:17,fw:'800',ff:'Playfair Display, serif',fill:'#ff3b30'});
  // Bas de page uniquement
  t(svg,20, s.h-24, `Signed on: ${DATA.signedOn}`, {fs:12,fw:'800'});
  const qrX = s.w - 20 - 78, qrY = s.h - 20 - 78;
  svg.appendChild(svgEl('rect',{x:qrX,y:qrY,width:78,height:78,rx:8,ry:8,fill:'rgba(255,255,255,.04)',stroke:'rgba(255,255,255,.2)'}));
  t(svg, qrX+39, qrY+44, 'QR', {fs:12,fw:'800'}).setAttribute('text-anchor','middle');
  return svg;
}

// 6 — Back cover (centré + texte demandé)
function pageBack(){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs=svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#020203'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg, s.w/2, 118, 'VISIT:', {fs:13, fw:'800', ff:'Playfair Display, serif', fill:'#ff3b30'}).setAttribute('text-anchor','middle');
  t(svg, s.w/2, 144, 'WWW.MATCHORMOVEON.COM', {fs:16, fw:'800', ff:'Playfair Display, serif', fill:'#ff3b30'}).setAttribute('text-anchor','middle');
  t(svg, s.w/2, 172, '© Match or Move On • Generated by Match and Move On', {fs:10, fw:'700', fill:'#ddd'}).setAttribute('text-anchor','middle');
  return svg;
}

/* ================= BUILD & EXPORT ================= */
let PAGES = [];

async function buildAll(){
  const gal = document.getElementById('gallery'); gal.innerHTML='';
  // photo → dataURL; si ça rate, on continue
  const photo = await toDataURL(DATA.photoUrl);
  PAGES = [ pageCover(), pageIdentity(photo), pageValues(), pageDeal(), pageVerify(), pageBack() ];
  PAGES.forEach(svg=>{ const card=document.createElement('div'); card.className='card'; card.appendChild(svg); gal.appendChild(card); });
  // enable download une fois prêt
  document.getElementById('dl').disabled = false;
}

function downloadPDF(){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'pt', format:[A6.w_pt, A6.h_pt], orientation:'portrait' });
  for(let i=0;i<PAGES.length;i++){
    if(i>0) pdf.addPage([A6.w_pt, A6.h_pt],'portrait');
    const scaleX = A6.w_pt / PREVIEW.w, scaleY = A6.h_pt / PREVIEW.h;
    svg2pdf(PAGES[i], pdf, { x:0, y:0, width:A6.w_pt, height:A6.h_pt, assumePt:true, scale:Math.min(scaleX,scaleY) });
  }
  try{ pdf.save('Love_Passport_A6.pdf'); }
  catch(e){
    const blob = pdf.output('blob'); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'Love_Passport_A6.pdf';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
}

/* boot */
buildAll();
document.getElementById('dl').addEventListener('click', downloadPDF);
</script>
</body>
</html>

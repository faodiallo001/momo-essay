<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Love Passport — A6 Vector PDF</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b0d;--ink:#f2ece7;--mut:#c9c2bb;--rose:#ff3b30}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .bar{position:sticky;top:0;z-index:3;display:flex;gap:10px;justify-content:center;padding:10px;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(#0b0b0d,rgba(11,11,13,.5))}
  .btn{background:transparent;color:var(--rose);border:1px solid var(--rose);padding:9px 12px;border-radius:999px;font-weight:700;cursor:pointer}
  .wrap{max-width:1100px;margin:16px auto;padding:0 10px}
  .grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  /* aperçu: A6 écran (297×420 px) */
  .card{width:297px;height:420px;background:#000;border-radius:12px;overflow:hidden;
        box-shadow:0 12px 28px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06)}
  .cap{font-size:12px;color:var(--mut);text-align:center;margin:8px 0}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
</style>
</head>
<body>

<div class="bar">
  <button class="btn" id="dl">Download Love Passport (A6 PDF)</button>
</div>

<div class="wrap">
  <div class="cap">Vector preview (SVG) — what you see is what goes to PDF (A6)</div>
  <div class="grid" id="gallery"></div>
</div>

<!-- libs (vector) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/svg2pdf.js@2.2.3/dist/svg2pdf.min.js" crossorigin="anonymous"></script>

<script>
/* ========= CONFIG / DATA (exemple) ========= */
const DATA = {
  lpid: 'LP-23A9-7XQ4',
  fullName: 'Amina K.',
  ageCountry: '25 • Brazil',
  religion: 'Muslim (practicing)',
  langs: 'English, French, Portuguese',
  origin: 'Benin',
  residency: 'São Paulo',
  marital: 'Single',
  kids: 'No',
  faith: 'Central',
  prayer: 'Daily',
  workStyle: 'Hard-working, builder',
  fitness: 'Gym 3×/week',
  smoke: 'No',
  alcohol: 'No',
  diet: 'No pork',
  hobbies: ['Working','Shopping','Social media','Music','Travel'],
  dealBreakers: 'Smokes, never exercises, heavy drinker, disrespects faith, constant jealousy, financial irresponsibility.',
  signedOn: new Date().toISOString().slice(0,10),
  // remplace par la vraie photo si tu veux :
  photoUrl: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=900&auto=format&fit=crop'
};

/* ========= CONSTANTES PDF ========= */
const MM_TO_PT = 72/25.4;
const A6 = { w_mm:105, h_mm:148, w_pt:105*MM_TO_PT, h_pt:148*MM_TO_PT };
// Pour l’aperçu écran : on garde 297×420 px (ratio A6)
const PREVIEW = { w:297, h:420 };

/* ========= HELPERS ========= */
// convertit une image en dataURL (pour l’inliner dans le SVG → pas de CORS)
async function toDataURL(url){
  const res = await fetch(url, {mode:'cors'}); const blob = await res.blob();
  return new Promise((ok)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.readAsDataURL(blob); });
}
// crée un élément SVG avec namespace
function svgEl(name, attrs={}){
  const el = document.createElementNS('http://www.w3.org/2000/svg', name);
  for(const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
  return el;
}
// style texte
function t(parent, x, y, txt, opts={}){
  const el = svgEl('text', {x, y, fill: opts.fill||'#f2ece7', 'font-family':opts.ff||'Inter, Arial', 'font-size':opts.fs||'12', 'font-weight':opts.fw||'600', 'letter-spacing':opts.ls||'0'});
  el.textContent = txt; parent.appendChild(el); return el;
}
// badge arrondi
function badge(parent, x, y, txt){
  const padX = 8, padY = 6, fs=10;
  const g = svgEl('g'); parent.appendChild(g);
  const temp = t(g, x+padX, y+fs+padY-2, txt, {fs, fw:'600', fill:'#eee'});
  const bbox = { w: txt.length*fs*0.6 + padX*2, h: fs+padY*2 };
  const r = svgEl('rect', {x, y: y, rx:12, ry:12, width: bbox.w, height: bbox.h, fill:'rgba(255,255,255,0.03)', stroke:'rgba(255,255,255,0.15)'});
  g.insertBefore(r, temp);
  return bbox.w + 6;
}

/* ========= PAGES (SVG vector) ========= */
// fond glossy (dégradé subtil)
function glossyBackground(defs){
  const lg = svgEl('linearGradient', {id:'gloss', x1:'0%',y1:'0%',x2:'100%',y2:'100%'});
  lg.appendChild(svgEl('stop',{offset:'0%','stop-color':'rgba(255,255,255,0.06)'}));
  lg.appendChild(svgEl('stop',{offset:'40%','stop-color':'rgba(255,255,255,0)'}));
  defs.appendChild(lg);
}
// coeur
function heart(defs){
  const rg = svgEl('radialGradient', {id:'hgrad', cx:'60%', cy:'35%', r:'60%'});
  rg.appendChild(svgEl('stop',{offset:'0%','stop-color':'#ff7a70'}));
  rg.appendChild(svgEl('stop',{offset:'40%','stop-color':'#ff3b30'}));
  rg.appendChild(svgEl('stop',{offset:'85%','stop-color':'#a91510'}));
  defs.appendChild(rg);
}
// PAGE 1 — Cover
function pageCover(){
  const svg = svgEl('svg', {viewBox:`0 0 ${PREVIEW.w} ${PREVIEW.h}`, width:PREVIEW.w, height:PREVIEW.h});
  const defs = svgEl('defs'); svg.appendChild(defs); glossyBackground(defs); heart(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:PREVIEW.w,height:PREVIEW.h,fill:'#020203'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:PREVIEW.w,height:PREVIEW.h,fill:'url(#gloss)'}));
  // titre
  t(svg, PREVIEW.w/2, 80, 'LOVE PASSPORT', {fs:24, fw:'800', ff:'Playfair Display, serif', fill:'#ff3b30'}).setAttribute('text-anchor','middle');
  // coeur
  const g = svgEl('g', {transform:`translate(${PREVIEW.w/2-40}, ${PREVIEW.h/2-30})`});
  g.appendChild(svgEl('path',{d:'M40 120 L0 60 A30 30 0 0 1 40 20 A30 30 0 0 1 80 60 Z', fill:'url(#hgrad)'}));
  svg.appendChild(g);
  // LPID
  const lp = t(svg, PREVIEW.w/2, PREVIEW.h-40, `LPID: ${DATA.lpid}`, {fs:12, fw:'800', ff:'Inter, Arial', fill:'#e7e1db'});
  lp.setAttribute('text-anchor','middle');
  return svg;
}

// PAGE 2 — Identity
function pageIdentity(photoDataUrl){
  const s = PREVIEW, svg = svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`, width:s.w, height:s.h});
  const defs = svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#050506'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg, 20, 32, 'Profile & Identity', {fs:16, fw:'800', ff:'Playfair Display, serif', fill:'#ff3b30'});
  // photo
  const ph = svgEl('image', {href:photoDataUrl, x:20, y:42, width:54, height:54, preserveAspectRatio:'xMidYMid slice'});
  const phB = svgEl('rect',{x:20,y:42,width:54,height:54,rx:10,ry:10, fill:'none', stroke:'rgba(255,255,255,0.2)'});
  svg.appendChild(ph); svg.appendChild(phB);
  t(svg, 84, 62, DATA.fullName, {fs:16, fw:'800'});
  t(svg, 84, 80, DATA.ageCountry, {fs:12, fw:'600', fill:'#d8d2cc'});
  // table
  const x1=20, x2=130, y0=118, lh=18, kf={fs:12, fw:'600', fill:'#c9c2bb'}, vf={fs:12, fw:'700'};
  const rows = [
    ['Religion', DATA.religion],
    ['LPID', DATA.lpid],
    ['Languages', DATA.langs],
    ['Origin', DATA.origin],
    ['Lives in', DATA.residency],
    ['Marital', DATA.marital],
    ['Kids', DATA.kids],
  ];
  rows.forEach((r,i)=>{ t(svg,x1,y0+i*lh,r[0],kf); t(svg,x2,y0+i*lh,r[1],vf); });
  return svg;
}

// PAGE 3 — Values / Lifestyle
function pageValues(){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs = svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#050506'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg,20,32,'Values & Lifestyle',{fs:16,fw:'800',ff:'Playfair Display, serif', fill:'#ff3b30'});
  const x1=20, x2=170, y0=64, lh=18, kf={fs:12,fw:'600',fill:'#c9c2bb'}, vf={fs:12,fw:'700'};
  const rows = [
    ['Faith',DATA.faith],['Prayer',DATA.prayer],['Work style',DATA.workStyle],
    ['Fitness',DATA.fitness],['Smoking',DATA.smoke],['Alcohol',DATA.alcohol],['Diet',DATA.diet]
  ];
  rows.forEach((r,i)=>{ t(svg,x1,y0+i*lh,r[0],kf); t(svg,x2,y0+i*lh,r[1],vf); });
  // hobbies badges
  t(svg,20, y0+lh*8, 'Hobbies', {fs:14,fw:'800',ff:'Playfair Display, serif', fill:'#ff3b30'});
  let x=20, y=y0+lh*8+10;
  DATA.hobbies.forEach(h=>{ const w=badge(svg,x,y,h); x+=w; if(x>PREVIEW.w-110){x=20; y+=28;} });
  return svg;
}

// PAGE 4 — Deal Breakers
function pageDeal(){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs = svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#050506'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg,20,32,'Deal Breakers',{fs:16,fw:'800',ff:'Playfair Display, serif', fill:'#ff3b30'});
  const box = svgEl('rect',{x:20,y:52,rx:12,ry:12,width:s.w-40,height:s.h-92,fill:'rgba(255,255,255,.03)',stroke:'rgba(255,255,255,.15)'}); svg.appendChild(box);
  const text = DATA.dealBreakers;
  // multi-ligne simple
  const words=text.split(' '); let line='', y=76;
  for(const w of words){
    const test=(line?line+' ':'')+w;
    if(test.length>46){ t(svg,34,y,line,{fs:12,fw:'600'}); line=w; y+=18; }
    else line=test;
  }
  if(line) t(svg,34,y,line,{fs:12,fw:'600'});
  return svg;
}

// PAGE 5 — Verify & Share
function pageVerify(){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs = svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#050506'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg,20,32,'Verify & Share',{fs:16,fw:'800',ff:'Playfair Display, serif', fill:'#ff3b30'});
  t(svg,20,60,'Signed on:',{fs:12,fw:'600',fill:'#c9c2bb'}); t(svg,100,60,DATA.signedOn,{fs:12,fw:'800'});
  t(svg,20,82,'LPID:',{fs:12,fw:'600',fill:'#c9c2bb'}); t(svg,100,82,DATA.lpid,{fs:12,fw:'800'});
  // placeholder QR
  const qr = svgEl('rect',{x:s.w-20-74,y:56,width:74,height:74,rx:8,ry:8,fill:'url(#gloss)',stroke:'rgba(255,255,255,.15)'}); svg.appendChild(qr);
  t(svg, s.w-20-37, 98, 'QR', {fs:12, fw:'800'}).setAttribute('text-anchor','middle');
  return svg;
}

// PAGE 6 — Back cover
function pageBack(){
  const s=PREVIEW, svg=svgEl('svg',{viewBox:`0 0 ${s.w} ${s.h}`,width:s.w,height:s.h});
  const defs = svgEl('defs'); svg.appendChild(defs); glossyBackground(defs);
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'#020203'}));
  svg.appendChild(svgEl('rect',{x:0,y:0,width:s.w,height:s.h,fill:'url(#gloss)'}));
  t(svg, s.w/2, 110, 'VISIT:', {fs:12, fw:'800', ff:'Playfair Display, serif', fill:'#ff3b30'}).setAttribute('text-anchor','middle');
  t(svg, s.w/2, 136, 'WWW.MATCHORMOVEON.COM', {fs:14, fw:'800', ff:'Playfair Display, serif', fill:'#ff3b30'}).setAttribute('text-anchor','middle');
  t(svg, s.w/2, 164, '© Match or Move On • Generated by AI', {fs:10, fw:'600', fill:'#d9d3cd'}).setAttribute('text-anchor','middle');
  return svg;
}

/* ========= RENDU ÉCRAN & EXPORT PDF ========= */
async function buildAll(){
  // photo => dataURL
  const photo = await toDataURL(DATA.photoUrl);
  const pages = [
    pageCover(),
    pageIdentity(photo),
    pageValues(),
    pageDeal(),
    pageVerify(),
    pageBack()
  ];
  // preview
  const gal = document.getElementById('gallery'); gal.innerHTML='';
  pages.forEach(svg=>{ const card=document.createElement('div'); card.className='card'; card.appendChild(svg); gal.appendChild(card); });
  return pages;
}

async function downloadPDF(pages){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'pt', format:[A6.w_pt, A6.h_pt], orientation:'portrait' });

  // svg2pdf : convertit le SVG en contenu vectoriel dans le PDF
  for(let i=0;i<pages.length;i++){
    if(i>0) pdf.addPage([A6.w_pt, A6.h_pt], 'portrait');
    // important: adapter le viewport (297×420) à la page (points)
    const scaleX = A6.w_pt / PREVIEW.w;
    const scaleY = A6.h_pt / PREVIEW.h;
    const opts = { x:0, y:0, width:A6.w_pt, height:A6.h_pt, assumePt:true, scale:Math.min(scaleX, scaleY) };
    await svg2pdf(pages[i], pdf, opts);
  }
  pdf.save('Love_Passport_A6.pdf');
}

/* boot */
let PAGES=[];
buildAll().then(p=>PAGES=p);

document.getElementById('dl').addEventListener('click', async ()=>{
  if(!PAGES.length) PAGES = await buildAll();
  await downloadPDF(PAGES);
});
</script>
</body>
</html>
